<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kokoro Read Aloud Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 32px auto; line-height: 1.45; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
    button { margin-top: 20px; padding: 8px 14px; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    #status { margin-top: 12px; color: #0a7b28; }
    .hint { color: #555; font-size: 0.95em; margin-top: 4px; }
    code { background: #f2f2f2; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Kokoro Read Aloud</h1>
  <p>Highlight text in Chrome, right-click it, then choose <strong>Read with Kokoro</strong>.</p>
  <p>The local server must be running at <code>http://127.0.0.1:8765</code>.</p>

  <label for="serverUrl">Server URL</label>
  <input id="serverUrl" type="url" value="http://127.0.0.1:8765">

  <label for="apiToken">API Token (optional but recommended)</label>
  <input id="apiToken" type="password" placeholder="Set KOKORO_API_TOKEN on server and paste same value here">
  <div class="hint">If set, requests include <code>Authorization: Bearer &lt;token&gt;</code>.</div>

  <div class="row">
    <div>
      <label for="voice">Voice</label>
      <select id="voice">
        <option value="af_heart">af_heart - American female</option>
        <option value="af_bella">af_bella - American female</option>
        <option value="af_nicole">af_nicole - American female</option>
        <option value="af_sky">af_sky - American female</option>
        <option value="am_adam">am_adam - American male</option>
        <option value="am_michael">am_michael - American male</option>
        <option value="bf_emma">bf_emma - British female</option>
        <option value="bf_isabella">bf_isabella - British female</option>
        <option value="bm_george">bm_george - British male</option>
        <option value="bm_lewis">bm_lewis - British male</option>
      </select>
    </div>
    <div>
      <label for="speed">Speed</label>
      <input id="speed" type="number" min="0.5" max="2" step="0.05" value="1.0">
    </div>
  </div>

  <label for="maxChars">Maximum selected characters to send</label>
  <input id="maxChars" type="number" min="0" max="200000" step="1000" value="0">
  <div class="hint">Use <code>0</code> for unlimited. The old default was 4000.</div>

  <button id="save">Save</button>
  <button id="test">Test Server</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
